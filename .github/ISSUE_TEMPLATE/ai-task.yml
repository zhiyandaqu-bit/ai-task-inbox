name: AI作業依頼
description: 担当を選び、ChatGPTから進めるための依頼を作成します
title: "【Instagram担当】"
body:
  - type: dropdown
    id: owner
    attributes:
      label: 担当
      description: 件名先頭も同じ担当名に変更してください
      options:
        - Instagram担当
        - 読書担当
        - LINEスタンプ担当
    validations:
      required: true
  - type: textarea
    id: request
    attributes:
      label: 依頼内容
      description: 公開リポジトリです。個人情報、認証情報、書籍本文は書かないでください
      placeholder: 何を作り、どこまで進めたいか
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: 完了条件
      placeholder: レビューできる成果物や確認したいこと
    validations:
      required: true
